  <!--
    ════════════════════════════════════════════════════════════
    ANTI-FLICKER THEME SCRIPT
    ════════════════════════════════════════════════════════════
    MUST run BEFORE Angular bootstraps to prevent:
      - White flash (FOUC) on dark-mode preference
      - Layout shift from theme switch during hydration

    Priority order:
      1. localStorage['aqario_theme'] — user's explicit choice
      2. prefers-color-scheme         — OS/browser preference
      3. 'dark'                       — safe default fallback

    This script is intentionally inline (not deferred) so the
    browser applies [data-theme] before the first paint.
    ════════════════════════════════════════════════════════════
  -->
  <script>
    (function () {
      var KEY = 'aqario_theme';
      var theme = 'dark'; // Default: Dark Mode
      try {
        var stored = localStorage.getItem(KEY);
        if (stored === 'light' || stored === 'dark') {
          // User has an explicit preference — always honour it
          theme = stored;
        }
        // No stored preference → stay on 'dark' (the default above)
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
