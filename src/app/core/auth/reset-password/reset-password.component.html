<div class="reset-page">
  <div class="reset-container">
    <div class="auth-brand">
      <span class="auth-brand-name">{{ 'BRAND_NAME' | translate }}</span>
    </div>

    <div class="reset-header">
      <h3>{{ 'AUTH.RESET_PAGE.CREATE_PASS' | translate }}</h3>
      <p>{{ 'AUTH.RESET_PAGE.DESC' | translate }}</p>
    </div>

    <p *ngIf="errorMsg" class="auth-error">{{ errorMsg }}</p>
    <p *ngIf="successMsg" class="auth-success">{{ successMsg }}</p>

    <form *ngIf="!successMsg && token" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="auth-field">
        <label class="auth-label">{{ 'ACCOUNT.SECURITY.NEW_PASS' | translate }}</label>
        <input type="password" class="auth-input" [class.invalid]="isFieldInvalid('password')"
          formControlName="password" placeholder="••••••••" />
        <span class="auth-validation" *ngIf="isFieldInvalid('password')">
          <ng-container *ngIf="resetForm.get('password')?.hasError('strongPassword')">{{
            'AUTH.RESET_PAGE.RESET_PASS_REQ' | translate }}</ng-container>
          <ng-container *ngIf="resetForm.get('password')?.hasError('required')">{{ 'AUTH.PASSWORD_REQ' | translate
            }}</ng-container>
        </span>
      </div>

      <div class="auth-field">
        <label class="auth-label">{{ 'ACCOUNT.SECURITY.CONFIRM_PASS' | translate }}</label>
        <input type="password" class="auth-input" [class.invalid]="isFieldInvalid('confirmPassword')"
          formControlName="confirmPassword" placeholder="••••••••" />
        <span class="auth-validation" *ngIf="isFieldInvalid('confirmPassword')">{{ 'AUTH.PASS_MISMATCH' | translate
          }}</span>
      </div>

      <button type="submit" class="auth-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ 'AUTH.RESET_PAGE.UPDATE_PASS' | translate }}</span>
        <span *ngIf="isLoading" class="auth-spinner"></span>
      </button>
    </form>
  </div>
</div>
