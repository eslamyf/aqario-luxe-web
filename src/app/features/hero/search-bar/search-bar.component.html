<div class="search-card" [formGroup]="searchForm">

  <!-- Filter Chips Row -->
  <div class="chips-row">
    <button *ngFor="let chip of chips" class="chip" [class.active]="activeChip === chip.value" type="button"
      (click)="selectChip(chip.value)">{{ chip.labelKey | translate }}</button>
  </div>

  <!-- Search Fields Row -->
  <div class="fields-row">

    <!-- Search Query -->
    <div class="field-group">
      <label class="field-label">{{ 'SEARCH.LABEL_SEARCH' | translate }}</label>
      <input class="field-input" type="text" [placeholder]="'SEARCH.PLACEHOLDER' | translate"
        formControlName="searchQuery" />
    </div>

    <div class="field-divider"></div>

    <!-- Property Type -->
    <div class="field-group">
      <label class="field-label">{{ 'SEARCH.LABEL_PROP_TYPE' | translate }}</label>
      <select class="field-input" formControlName="propertyType">
        <option *ngFor="let t of propertyTypes" [value]="t.value">{{ t.labelKey | translate }}</option>
      </select>
    </div>

    <div class="field-divider"></div>

    <!-- Listing Type -->
    <div class="field-group">
      <label class="field-label">{{ 'SEARCH.LABEL_LIST_TYPE' | translate }}</label>
      <select class="field-input" formControlName="listingType">
        <option *ngFor="let lt of listingTypes" [value]="lt.value">{{ lt.labelKey | translate }}</option>
      </select>
    </div>

    <div class="field-divider"></div>

    <!-- Max Budget -->
    <div class="field-group">
      <label class="field-label">{{ 'SEARCH.LABEL_BUDGET' | translate }}</label>
      <select class="field-input" formControlName="budget">
        <option *ngFor="let b of budgets" [value]="b.value">{{ b.labelKey | translate }}</option>
      </select>
    </div>

    <!-- Search Button -->
    <button class="btn-search" type="button" (click)="onExplore()">
      <span>{{ 'SEARCH.BTN_EXPLORE' | translate }}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
    </button>

  </div>

  <!-- Secondary Row: List Property -->
  <div class="secondary-row">
    <span class="secondary-text">{{ 'SEARCH.OWN_LUXURY' | translate }}</span>
    <button class="btn-list-prop" type="button">{{ 'SEARCH.BTN_LIST' | translate }}</button>
  </div>

</div>
