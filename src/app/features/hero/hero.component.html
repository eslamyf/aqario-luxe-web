<section class="hero">

  <!-- Layer 1: Gradient Background -->
  <div class="hero-bg"></div>

  <!-- Layer 2: 3D Perspective Grid -->
  <div class="hero-grid"></div>

  <!-- Layer 3: Floating Orbs -->
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>

  <!-- ── FULL-SCREEN BACKGROUND: Luxury Architectural Image ── -->
  <div class="hero-visual" [@heroImage]="animState" aria-hidden="true">
    <div class="hero-visual-frame">
      <!-- Primary: high-quality luxury villa photograph -->
      <img class="hero-visual-img"
        src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1200&q=85"
        [alt]="'HOME.HERO.IMAGE_ALT' | translate" loading="eager" decoding="async" (error)="onImageError($event)" />
      <!-- Gradient fade mask — blends image into the hero background -->
      <div class="hero-visual-mask"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       HERO BODY — Content container (floats on top of background)
  ════════════════════════════════════════════════════════════ -->
  <div class="hero-body">

    <!-- ── LEFT: Text Content ─────────────────────────────────── -->
    <div class="hero-content">

      <!-- Eyebrow: font-mono, 11px, letter-spacing 4px, gold -->
      <div class="hero-eyebrow" [@eyebrow]="animState">
        {{ 'HOME.HERO.EYEBROW' | translate }}
      </div>

      <!-- Headline -->
      <h1 class="hero-headline" [@headline1]="animState">
        {{ 'HOME.HERO.HERO_HEADLINE' | translate }}
      </h1>

      <!-- Sub-text -->
      <p class="hero-sub" [@subText]="animState">
        {{ 'HOME.HERO.HERO_SUBTEXT' | translate }}
      </p>

      <!-- CTA Buttons -->
      <div class="hero-actions" [@buttons]="animState">
        <button id="btn-explore-properties" class="btn-primary" data-cursor-hover (click)="scrollToProperties()">
          {{ 'HOME.HERO.EXPLORE' | translate }}
        </button>
        <button id="btn-list-property" class="btn-secondary" data-cursor-hover (click)="navigateToAddProperty()">
          {{ 'HOME.HERO.LIST' | translate }}
        </button>
      </div>

    </div><!-- /hero-content -->

  </div><!-- /hero-body -->

  <!-- Scroll indicator: bottom-left -->
  <div class="hero-scroll-indicator">
    <span class="scroll-label">{{ 'HOME.HERO.SCROLL' | translate }}</span>
    <div class="scroll-line"></div>
  </div>

  <!-- Search Bar — positioned at hero bottom -->
  <div class="hero-search-wrap" [@buttons]="animState">
    <app-search-bar (explore)="onExplore($event)"></app-search-bar>
  </div>

</section>

<!-- ═══════════════════════════════════════════════════════════
     MARKET TICKER STRIP
     Infinitely scrolling property market data
     ════════════════════════════════════════════════════════════ -->
<div class="ticker-wrap">
  <div class="ticker-track">
    <span class="ticker-item" *ngFor="let item of allTickerItems">
      <span class="ticker-label">{{ 'HOME.TICKER.' + item.key | translate }}</span>
      <span class="ticker-change" [class.positive]="item.positive" [class.negative]="!item.positive">
        {{ item.positive ? '↑' : '↓' }} {{ item.change }}%
      </span>
      <span class="ticker-sep">·</span>
    </span>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     HOME PAGE SECTIONS (Partners · Properties · Value · Contact)
     ════════════════════════════════════════════════════════════ -->
<app-home-sections></app-home-sections>
