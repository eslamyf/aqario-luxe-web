<div class="saved-page">
  <div class="page-header">
    <div class="section-eyebrow">{{ 'DASHBOARD.WISHLIST' | translate }}</div>
    <h1>{{ 'DASHBOARD.SAVED_TITLE' | translate }}</h1>
    <p>{{ 'DASHBOARD.SAVED_SUB' | translate }}</p>
  </div>

  <div class="saved-container">
    <!-- Loading Skeleton Grid -->
    <div *ngIf="isLoading" class="saved-skeleton-grid">
      <div class="skeleton-card" *ngFor="let item of [1,2,3]"></div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && properties.length === 0" class="empty-state-card">
      <div class="empty-icon-wrap">
        <i class="fa-solid fa-heart-crack"></i>
      </div>
      <h2>{{ 'DASHBOARD.NO_SAVED' | translate }}</h2>
      <p>{{ 'DASHBOARD.NO_SAVED_SUB' | translate }}</p>
      <button class="btn-gold-browse" (click)="navigateToBrowse()">
        <i class="fa-solid fa-compass"></i>
        <span>{{ 'HOME.SECTIONS.BROWSE_ALL' | translate }}</span>
      </button>
    </div>

    <!-- Properties Grid using Luxury Property Cards -->
    <div class="saved-grid" *ngIf="!isLoading && properties.length > 0">
      <app-property-card
        *ngFor="let prop of properties; let i = index"
        [property]="prop"
        [isFirst]="i === 0"
        (favoriteToggled)="onFavoriteToggled($any($event))">
      </app-property-card>
    </div>
  </div>
</div>
